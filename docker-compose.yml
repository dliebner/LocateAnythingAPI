version: '3.8'

services:
  locateanything-api:
    build: .
    container_name: locateanything-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    shm_size: '4gb' # Prevents PyTorch shared memory crashes
    volumes:
      - huggingface_cache:/root/.cache/huggingface # Prevents re-downloading the 6GB model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface_cache: